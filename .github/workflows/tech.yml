name: Sommario tecnico
on:
  workflow_dispatch:
    inputs:
      tickers: {description: "Ticker yfinance separati da virgola", default: ""}
  schedule: [{cron: "45 16 * * 1-5"}]
permissions: {contents: write}
jobs:
  calcola:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance pandas numpy
      - run: python scripts/compute_tech.py "${{ github.event.inputs.tickers }}"
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/tech; git diff --staged --quiet || (git commit -m "Aggiornamento sommario tecnico" && git push)
