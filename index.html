<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sommario tecnico ETF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>:root{--ink:#1b2430;--mut:#5d6773;--line:#d9dee4;--acc:#0b5c8a;--up:#17734a;--dn:#b3261e;--ne:#7a6200}*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,Arial,sans-serif}main{max-width:1240px;margin:auto;padding:20px 16px 48px}h1{font-size:22px;margin:0}.sub{color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button,input{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--acc);border-radius:4px;background:#fff;color:var(--acc)}input{color:var(--ink);border-color:var(--line)}button{cursor:pointer}button:hover{background:var(--acc);color:#fff}
.wrap{overflow-x:visible}td:nth-child(2){max-width:260px;overflow:hidden;text-overflow:ellipsis}@media(max-width:900px){th:nth-child(2),td:nth-child(2),th:nth-child(8),td:nth-child(8){display:none}}@media(max-width:600px){.wrap{overflow-x:auto}}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:6px 6px;font-size:14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{cursor:pointer;color:var(--mut);font-size:13px;font-weight:600}th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}a{color:var(--acc);font-weight:600}
.Compra,.Compra\ Adesso{color:var(--up)}.Vendi,.Vendi\ Adesso{color:var(--dn)}.Neutrale{color:var(--ne)}td small{color:var(--mut)}footer{margin-top:24px;font-size:12px;color:var(--mut)}</style></head>
<body><main><h1>Sommario tecnico ETF</h1><div class="sub" id="sub">Caricamento…</div>
<div class="bar"><input id="f" placeholder="Cerca ticker o nome" oninput="draw()"><button onclick="xl()">Scarica Excel</button><button onclick="pdf()">Regole PDF</button></div>
<div class="wrap"><table id="t"></table></div><footer>Segnali con regole proprie (vedi Regole PDF), indicativi e non coincidenti con quelli di Investing.com. Clicca il ticker per grafico e dettaglio.</footer></main>
<script>
let R=[],S=['saldoD',-1];const C=[['ticker','Ticker'],['nome','Nome'],['prezzo','Prezzo'],['var_pct','Var %'],['D','Giornaliero'],['W','Settimanale'],['M','Mensile'],['ultima','Ultima barra']];
const n=(v,d=2)=>v==null?'–':Number(v).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const val=(r,k)=>'DWM'.includes(k)&&k.length==1?(r[k][1]??-999):r[k];
fetch('data/tech/index.json?t='+Date.now()).then(r=>r.json()).then(j=>{R=j.righe;document.getElementById('sub').textContent=R.length+' ETF · dati generati '+j.generato;draw()}).catch(()=>document.getElementById('sub').textContent='Indice non disponibile: lancia il workflow Sommario tecnico da GitHub → Actions.');
function sort(k){S=[k,S[0]==k?-S[1]:1];draw()}
function draw(){const q=document.getElementById('f').value.toLowerCase(),k=S[0].replace('saldo','');
 const rows=R.filter(r=>(r.ticker+r.nome).toLowerCase().includes(q)).sort((a,b)=>{const x=val(a,k),y=val(b,k);return (x>y?1:x<y?-1:0)*S[1]});
 document.getElementById('t').innerHTML='<tr>'+C.map(([k,l])=>`<th onclick="sort('${k}')">${l}</th>`).join('')+'</tr>'+rows.map(r=>`<tr><td><a href="dettaglio.html?y=${r.ticker}">${r.ticker}</a></td><td title="${r.nome}">${r.nome}</td><td>${n(r.prezzo)}</td><td class="${r.var_pct>=0?'Compra':'Vendi'}">${n(r.var_pct)}</td>${'DWM'.split('').map(t=>`<td class="${r[t][0]||''}">${r[t][0]||'–'} <small>${r[t][1]==null?'':n(r[t][1],0)+'%'}</small></td>`).join('')}<td class="${r.agg===false?'Vendi':''}">${r.ultima||'–'}</td></tr>`).join('')}
function xl(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(R.map(r=>({Ticker:r.ticker,Nome:r.nome,Borsa:r.borsa,Prezzo:r.prezzo,'Var %':r.var_pct,Giornaliero:r.D[0],'Saldo D %':r.D[1],Settimanale:r.W[0],'Saldo W %':r.W[1],Mensile:r.M[0],'Saldo M %':r.M[1],'Ultima barra':r.ultima}))),'Sommario');XLSX.writeFile(wb,'sommario_tecnico.xlsx')}
async function pdf(){const r=await (await fetch('regole.json?t='+Date.now())).json(),p=new jspdf.jsPDF();let y=20;p.setFontSize(15);p.text('Regole del sommario tecnico (v'+r.versione+', '+r.aggiornato+')',15,y);y+=10;p.setFontSize(10);
 for(const [a,b] of r.regole){const L=p.splitTextToSize(b,180);if(y+6+L.length*5>280){p.addPage();y=20}p.setFont(undefined,'bold');p.text(a,15,y);p.setFont(undefined,'normal');y+=5;p.text(L,15,y);y+=L.length*5+4}p.save('regole_sommario_tecnico.pdf')}
</script></body></html>
