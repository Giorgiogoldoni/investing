<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sommario tecnico ETF – tutto core</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>:root{--ink:#1b2430;--mut:#5d6773;--line:#d9dee4;--acc:#0b5c8a;--up:#17734a;--dn:#b3261e;--ne:#7a6200}*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,Arial,sans-serif}main{max-width:1280px;margin:auto;padding:20px 16px 48px}h1{font-size:22px;margin:0}.sub{color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}button,input,select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--acc);border-radius:4px;background:#fff;color:var(--acc)}input,select{color:var(--ink);border-color:var(--line)}button{cursor:pointer}button:hover,button.on{background:var(--acc);color:#fff}button:disabled{opacity:.4;cursor:default}
label{font-size:13px;color:var(--ink);display:flex;gap:4px;align-items:center}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:5px 6px;font-size:14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{cursor:pointer;color:var(--mut);font-size:13px;font-weight:600}
th:nth-child(-n+4),td:nth-child(-n+4){text-align:left}td:nth-child(3){max-width:240px;overflow:hidden;text-overflow:ellipsis}a{color:var(--acc);font-weight:600}
.Compra,.Compra\ Adesso{color:var(--up)}.Vendi,.Vendi\ Adesso{color:var(--dn)}.Neutrale{color:var(--ne)}td small{color:var(--mut)}footer{margin-top:20px;font-size:12px;color:var(--mut)}
@media(max-width:900px){th:nth-child(3),td:nth-child(3),th:nth-child(15),td:nth-child(15){display:none}}@media(max-width:600px){.w{overflow-x:auto}}</style></head>
<body><main><h1>Sommario tecnico ETF/ETP – tutto core</h1><div class="sub" id="sub">Caricamento…</div>
<div class="bar"><input id="f" size="26" placeholder="Cerca ticker, nome, ISIN, emittente" oninput="P=0;draw()"><select id="iss" onchange="P=0;draw()"><option value="">Tutti gli emittenti</option></select>
<button id="mig" onclick="mig()">★ Migliori</button><button onclick="xl()">Scarica Excel</button><button onclick="pdf()">Regole PDF</button></div>
<div class="bar"><label><input type="checkbox" id="c1" onchange="P=0;draw()">D, W, M almeno Compra</label><label><input type="checkbox" id="c2" onchange="P=0;draw()">Saldo medio ≥ +40%</label><label><input type="checkbox" id="c3" onchange="P=0;draw()">Non ipercomprati</label><label><input type="checkbox" id="c4" onchange="P=0;draw()">Solo aggiornati</label><label><input type="checkbox" id="c5" onchange="P=0;draw()">Solo non-leva</label><label><input type="checkbox" id="c6" onchange="P=0;draw()">Solo con grafico</label><label><input type="checkbox" id="c7" onchange="P=0;draw()">Core: BUY1/BUY2</label><label>Scambi min €<input id="tu" type="number" value="0" min="0" step="10000" style="width:90px" onchange="P=0;draw()"></label></div>
<div class="w"><table id="t"></table></div><div class="bar"><button id="pp" onclick="P--;draw()">←</button><span id="pg" class="sub"></span><button id="pn" onclick="P++;draw()">→</button></div>
<footer>Segnali con regole proprie (vedi Regole PDF): indicativi, non coincidono con Investing.com. "Migliori" = più allineati, non migliori per rendimento atteso. Ticker senza grafico: il click apre i collegamenti a core e TradingView.</footer></main>
<script>
const $=i=>document.getElementById(i),PS=100,OK=['Compra','Compra Adesso'];let R=[],S=['sc',-1],P=0,F=[];
const C=[['ticker','Ticker'],['tv','TV'],['nome','Nome'],['issuer','Emittente'],['leva','Leva'],['prezzo','Prezzo'],['var_pct','Var %'],['D','Giornaliero'],['W','Settimanale'],['M','Mensile'],['cdD','Compra dal (G)'],['sig','Segnale core'],['sc','Saldo medio'],['turn','Scambi €/g'],['ultima','Ultima barra']];
const n=(v,d=2)=>v==null?'–':Number(v).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const TV={MI:'MIL',DE:'XETR'},tv=t=>(TV[t.split('.').pop()]||'')+':'+t.split('.')[0];
const val=(r,k)=>k=='cdD'?((r.cd&&r.cd[0])||''):k=='sig'?(r.sig||''):('DWM'.includes(k)&&k.length==1?(r[k][1]??-999):(r[k]??-1e12));
fetch('data/tech/index.json?t='+Date.now()).then(r=>r.json()).then(j=>{R=j.righe;$('sub').textContent=R.length+' strumenti · dati generati '+j.generato;
 [...new Set(R.map(r=>r.issuer))].sort().forEach(i=>$('iss').insertAdjacentHTML('beforeend',`<option>${i}</option>`));draw()}).catch(()=>$('sub').textContent='Indice non disponibile: lancia il workflow Sommario tecnico da GitHub → Actions.');
function mig(){['c1','c2','c3','c4'].forEach(i=>$(i).checked=true);$('tu').value=50000;S=['sc',-1];P=0;draw()}
function sort(k){S=[k,S[0]==k?-S[1]:1];P=0;draw()}
function draw(){const q=$('f').value.toLowerCase(),is=$('iss').value,m=+$('tu').value||0,k=S[0];
 F=R.filter(r=>(!q||(r.ticker+' '+r.nome+' '+(r.isin||'')+' '+r.issuer).toLowerCase().includes(q))&&(!is||r.issuer==is)&&(!$('c1').checked||['D','W','M'].every(t=>OK.includes(r[t][0])))&&(!$('c2').checked||(r.sc!=null&&r.sc>=40))&&(!$('c3').checked||(r.estr||0)<2)&&(!$('c4').checked||r.agg!==false)&&(!$('c5').checked||!r.leva)&&(!$('c6').checked||r.det)&&(!$('c7').checked||['BUY1','BUY2'].includes(r.sig))&&(!m||(r.turn||0)>=m))
  .sort((a,b)=>{const x=k=='tv'?0:val(a,k),y=k=='tv'?0:val(b,k);return (x>y?1:x<y?-1:0)*S[1]});
 const pages=Math.max(1,Math.ceil(F.length/PS));P=Math.min(Math.max(P,0),pages-1);
 $('t').innerHTML='<tr>'+C.map(([k,l])=>`<th onclick="sort('${k}')">${l}</th>`).join('')+'</tr>'+F.slice(P*PS,P*PS+PS).map(r=>`<tr><td><a href="dettaglio.html?y=${r.ticker}">${r.ticker}</a>${r.det?' 📈':''}</td><td><a target="_blank" rel="noopener" title="${tv(r.ticker)}" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(tv(r.ticker))}">TV↗</a></td><td title="${r.nome}">${r.nome}</td><td>${r.issuer}</td><td>${r.leva?'Sì':''}</td><td>${n(r.prezzo)}</td><td class="${r.var_pct>=0?'Compra':'Vendi'}">${n(r.var_pct)}</td>${'DWM'.split('').map(t=>`<td class="${r[t][0]||''}">${r[t][0]||'–'} <small>${r[t][1]==null?'':n(r[t][1],0)+'%'}</small></td>`).join('')}<td>${r.cd&&r.cd[0]?r.cd[0]+' <small>'+(r.rd>=0?'+':'')+n(r.rd,1)+'%</small>':'–'}</td><td class="${/^BUY/.test(r.sig||'')?'Compra':/^EXIT/.test(r.sig||'')?'Vendi':''}">${r.sig||'–'} <small>${r.sigdal||''}</small></td><td>${r.sc==null?'–':n(r.sc,0)+'%'}</td><td>${r.turn==null?'–':n(r.turn,0)}</td><td class="${r.agg===false?'Vendi':''}">${r.ultima||'–'}</td></tr>`).join('');
 $('pg').textContent=F.length+' risultati · pagina '+(P+1)+' di '+pages;$('pp').disabled=P==0;$('pn').disabled=P>=pages-1;$('mig').className=$('c1').checked&&$('c2').checked&&$('c3').checked&&$('c4').checked?'on':''}
function xl(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(F.map(r=>({Ticker:r.ticker,ISIN:r.isin,Nome:r.nome,Emittente:r.issuer,Leva:r.leva?'Sì':'',Borsa:r.borsa,Prezzo:r.prezzo,'Var %':r.var_pct,Giornaliero:r.D[0],'Saldo D %':r.D[1],Settimanale:r.W[0],'Saldo W %':r.W[1],Mensile:r.M[0],'Saldo M %':r.M[1],'Compra dal (G)':r.cd&&r.cd[0]||'','Compra dal (S)':r.cd&&r.cd[1]||'','Compra dal (M)':r.cd&&r.cd[2]||'','Rend. da ingresso G %':r.rd,'Cambi di stato 60g':r.cam,'Segnale core':r.sig||'','Segnale core dal':r.sigdal||'','Saldo medio %':r.sc,'Indicatori estremi':r.estr,'Incrocio MACD recente':r.mx||'','Scambi medi 20gg €':r.turn,'Ultima barra':r.ultima}))),'Sommario');XLSX.writeFile(wb,'sommario_tecnico.xlsx')}
async function pdf(){const r=await (await fetch('regole.json?t='+Date.now())).json(),p=new jspdf.jsPDF();let y=20;p.setFontSize(15);p.text('Regole del sommario tecnico (v'+r.versione+', '+r.aggiornato+')',15,y);y+=10;p.setFontSize(10);
 for(const [a,b] of r.regole){const L=p.splitTextToSize(b,180);if(y+6+L.length*5>280){p.addPage();y=20}p.setFont(undefined,'bold');p.text(a,15,y);p.setFont(undefined,'normal');y+=5;p.text(L,15,y);y+=L.length*5+4}p.save('regole_sommario_tecnico.pdf')}
</script></body></html>
